[versions]
# Build tools & language
agp = "9.1.1"
kotlin = "2.4.10"
composeMultiplatform = "1.11.1"

# Library dependencies: the oldest versions the sources build with, so a host's newer
# versions win dependency resolution and linking the library upgrades nothing.
# AndroidX / Jetpack (Android-only)
androidxMaterial = "1.8.0"
androidxMaterialIcons = "1.7.6"
androidxMaterial3 = "1.4.0"
materialNavigation = "1.8.0"
navigationCompose = "2.9.0"

# Kotlin/Compose Multiplatform equivalents
jetbrainsMaterial = "1.9.0"
jetbrainsMaterialIcons = "1.7.3"
jetbrainsMaterial3 = "1.9.0"
jetbrainsMaterialNavigation = "1.9.0"
jetbrainsNavigationCompose = "2.9.0"

# Both platforms
kotlinxSerialization = "1.6.3"

# Testing
junit = "4.13.2"
androidxJUnit = "1.3.0"
androidxEspresso = "3.7.0"

[libraries]
# Jetpack Compose (Android-only)
androidx-material = { module = "androidx.compose.material:material", version.ref = "androidxMaterial" }
androidx-material-icons-core = { module = "androidx.compose.material:material-icons-core", version.ref = "androidxMaterialIcons" }
androidx-material3 = { module = "androidx.compose.material3:material3", version.ref = "androidxMaterial3" }
androidx-material-navigation = { module = "androidx.compose.material:material-navigation", version.ref = "materialNavigation" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

# Kotlin/Compose Multiplatform equivalents
compose-material = { module = "org.jetbrains.compose.material:material", version.ref = "jetbrainsMaterial" }
compose-material-icons-core = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "jetbrainsMaterialIcons" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "jetbrainsMaterial3" }
jetbrains-material-navigation = { module = "org.jetbrains.compose.material:material-navigation", version.ref = "jetbrainsMaterialNavigation" }
jetbrains-navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "jetbrainsNavigationCompose" }

# Both platforms
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinxSerialization" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJUnit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidxEspresso" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# Kotlin/Compose Multiplatform equivalents (unused by the Android library today)
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
