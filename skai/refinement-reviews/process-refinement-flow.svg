<svg xmlns="http://www.w3.org/2000/svg" width="680" height="720" viewBox="0 0 680 720" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Refinement process</title>
<desc>Three lanes, supervisor, refiner and reviewer. The supervisor brings a problem; the refiner drafts the proposed change; the reviewer reviews and shapes it; the refiner triages, escalating to the supervisor where needed; while there is anything to apply, the refiner applies and checks it and the reviewer runs another round; when a round leaves nothing to apply, the refiner closes the pass and the supervisor reviews the finished change.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="720" fill="#FFFFFF"/>
<g fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"><rect x="40" y="64" width="180" height="640" rx="8"/><rect x="250" y="64" width="180" height="640" rx="8"/><rect x="460" y="64" width="180" height="640" rx="8"/></g>
<g font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle"><text x="130" y="53">Supervisor</text><text x="340" y="53">Refiner</text><text x="550" y="53">Reviewer</text></g>
<g text-anchor="middle">
<g><rect x="45" y="80" width="170" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="130" y="103" font-size="14" font-weight="500" fill="#2C2C2A">Bring the problem</text><text x="130" y="121" font-size="12" fill="#5F5E5A">Problem and goal</text></g>
<g><rect x="255" y="160" width="170" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="340" y="183" font-size="14" font-weight="500" fill="#3C3489">Draft the proposal</text><text x="340" y="201" font-size="12" fill="#534AB7">Spec + proposed change</text></g>
<g><rect x="465" y="240" width="170" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="550" y="263" font-size="14" font-weight="500" fill="#085041">Review and shape</text><text x="550" y="281" font-size="12" fill="#0F6E56">Defects, fixes, wording</text></g>
<g><rect x="255" y="320" width="170" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="340" y="343" font-size="14" font-weight="500" fill="#3C3489">Triage and score</text><text x="340" y="361" font-size="12" fill="#534AB7">Accept, amend, escalate</text></g>
<g><rect x="45" y="320" width="170" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="130" y="343" font-size="14" font-weight="500" fill="#2C2C2A">Rule on escalations</text><text x="130" y="361" font-size="12" fill="#5F5E5A">Weight, design, caps</text></g>
<g><rect x="255" y="400" width="170" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="340" y="427" font-size="14" font-weight="500" fill="#3C3489">Anything to apply?</text></g>
<g><rect x="255" y="480" width="170" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="340" y="503" font-size="14" font-weight="500" fill="#3C3489">Apply and check</text><text x="340" y="521" font-size="12" fill="#534AB7">Self-check, measure</text></g>
<g><rect x="255" y="560" width="170" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="340" y="583" font-size="14" font-weight="500" fill="#3C3489">Close the pass</text><text x="340" y="601" font-size="12" fill="#534AB7">Findings log</text></g>
<g><rect x="45" y="640" width="170" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="130" y="663" font-size="14" font-weight="500" fill="#2C2C2A">Review the change</text><text x="130" y="681" font-size="12" fill="#5F5E5A">The finished guide</text></g>
</g>
<g fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)">
<path d="M130 132 L130 146 L340 146 L340 158"/>
<path d="M340 212 L340 226 L550 226 L550 238"/>
<path d="M550 292 L550 306 L340 306 L340 318"/>
<line x1="253" y1="346" x2="217" y2="346" stroke-dasharray="3 3" marker-start="url(#a)"/>
<line x1="340" y1="372" x2="340" y2="398"/>
<line x1="340" y1="444" x2="340" y2="478"/>
<path d="M425 506 L610 506 L610 294"/>
<path d="M255 422 L235 422 L235 586 L253 586"/>
<path d="M340 612 L340 626 L130 626 L130 638"/>
</g>
<g font-size="12" fill="#5F5E5A"><text x="348" y="465">Yes</text><text x="532" y="526" text-anchor="middle">Next round</text><text x="226" y="412" text-anchor="end">No</text></g>
</svg>
